name: Daily job scan

on:
  schedule:
    # Backup times in case a run is delayed or dropped.
    # A backup run stops early if today's scan has already happened.
    - cron: "30 3 * * *"   # 9:00 AM IST
    - cron: "47 4 * * *"   # 10:17 AM IST (backup)
    - cron: "17 6 * * *"   # 11:47 AM IST (backup)
    - cron: "*/10 * * * *" # TEMPORARY: schedule test, remove after
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: scan but don't save"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan job sources
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SKIP_IF_SCANNED_TODAY: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: node scripts/scan.mjs

      - name: Commit updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily scan $(TZ=Asia/Kolkata date +%F)"
            git push
          fi
